<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tomorrow?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100dvh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { display: block; max-width: 100%; }
button { font: inherit; cursor: pointer; }
h1, p, figure, dl, dd { margin: 0; }

/* ---------- buttons (shared; the No button lives on <body> once it starts running) ---------- */
.btn { border: 0; padding: .7em 1.5em; font-weight: 700; line-height: 1; white-space: nowrap; touch-action: manipulation; user-select: none; }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.btn-yes { transition: transform .25s cubic-bezier(.3,1.4,.5,1); transform-origin: center; position: relative; z-index: 2; }
.btn-no.floating { position: fixed; z-index: 50; margin: 0; transition: left .2s cubic-bezier(.2,.8,.2,1), top .2s cubic-bezier(.2,.8,.2,1); }
.no-spacer { display: inline-block; flex: none; }
@media (prefers-reduced-motion: reduce) {
  .btn-yes, .btn-no.floating { transition: none; }
}

/* photos get sadder when only one real photo exists (data-sad 0..3) */
img[data-sad="1"] { filter: grayscale(.4) brightness(.95); }
img[data-sad="2"] { filter: grayscale(.8) brightness(.88); }
img[data-sad="3"] { filter: grayscale(1) brightness(.78) contrast(1.1); }

/* ================= Look A: text thread ================= */
html[data-look="a"] { --focus: #14161B; }
html[data-look="a"] body { background: #E6EAF1; color: #14161B; font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.chat { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.chat-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: #E6EAF1; border-bottom: 1px solid #CDD4DF; }
.chat-head img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
.chat-head .who { font-weight: 650; }
.chat-head .status { font-size: 14px; color: #586273; min-height: 1.3em; }
.msgs { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 20px 18px 24px; }
.msg { max-width: 80%; align-self: flex-start; background: #fff; padding: 9px 14px; border-radius: 19px 19px 19px 6px; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: #2740E6; color: #fff; border-radius: 19px 19px 6px 19px; }
.msg.photo { padding: 4px; border-radius: 16px 16px 16px 6px; }
.msg.photo img { width: 250px; aspect-ratio: 1; object-fit: cover; border-radius: 13px; }
.msg.photo.wide img { width: 320px; aspect-ratio: 4 / 3; }
.msg.plan { padding: 14px 16px; border-radius: 16px 16px 16px 6px; }
.msg.typing { color: #586273; letter-spacing: 3px; }
.reply { position: sticky; bottom: 0; display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: 16px 18px 22px; background: #E6EAF1; border-top: 1px solid #CDD4DF; min-height: 84px; }
.reply[hidden] { display: none; }
html[data-look="a"] .btn { border-radius: 22px; font-size: 17px; }
html[data-look="a"] .btn-yes, html[data-look="a"] .btn-no.gave-up { background: #2740E6; color: #fff; }
html[data-look="a"] .btn-no { background: #fff; color: #14161B; box-shadow: inset 0 0 0 1.5px #9AA5B6; }
html[data-look="a"] .btn-no.gave-up { box-shadow: none; }

/* shared plan list */
.plan-list { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
.plan-list dt { opacity: .7; }
.plan-list dd { font-weight: 600; }

/* ================= Looks B and C: one screen ================= */
.stage { min-height: 100dvh; display: grid; align-items: center; }
.pics { position: relative; }
.mood figcaption { font-size: 14px; margin-top: 6px; }
.line { min-height: 3.2em; }
.answers { display: flex; align-items: center; gap: 18px; }
.stage .btn-yes { transform-origin: left center; }
.foot { opacity: .75; font-size: 15px; }

/* ---- Look B: court green, photo first ---- */
html[data-look="b"] { --focus: #F1EFE4; }
html[data-look="b"] body { background: #14382B; color: #F1EFE4; font: 19px/1.45 "Bricolage Grotesque", system-ui, sans-serif; }
html[data-look="b"] .stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 80px); padding: clamp(20px, 5vw, 72px); max-width: 1280px; margin: 0 auto; }
html[data-look="b"] .couple { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px; }
html[data-look="b"] .mood { position: absolute; right: -18px; bottom: -22px; width: 38%; background: #F1EFE4; color: #14382B; padding: 8px 8px 10px; border-radius: 4px; transform: rotate(3deg); }
html[data-look="b"] .mood img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 2px; }
html[data-look="b"] h1 { font-size: clamp(40px, 5.2vw, 76px); line-height: 1; font-weight: 750; letter-spacing: -.02em; text-wrap: balance; }
html[data-look="b"] .sub { margin-top: 22px; max-width: 30em; }
html[data-look="b"] .note { margin-top: 6px; opacity: .75; }
html[data-look="b"] .line { margin-top: 26px; font-size: 24px; line-height: 1.25; font-weight: 600; color: #D7F23F; max-width: 22em; }
html[data-look="b"] .answers { margin-top: 12px; }
html[data-look="b"] .btn { border-radius: 8px; font-size: 20px; }
html[data-look="b"] .btn-yes, html[data-look="b"] .btn-no.gave-up { background: #D7F23F; color: #14382B; }
html[data-look="b"] .btn-no { background: transparent; color: #F1EFE4; box-shadow: inset 0 0 0 2px #F1EFE4; }
html[data-look="b"] .btn-no.gave-up { box-shadow: none; }
html[data-look="b"] .plan-list { margin-top: 28px; font-size: 20px; }
html[data-look="b"] .foot { margin-top: 26px; }

/* ---- Look C: marigold poster, type first ---- */
html[data-look="c"] { --focus: #1B1408; }
html[data-look="c"] body { background: #F5B301; color: #1B1408; font: 19px/1.45 "Archivo", system-ui, sans-serif; }
html[data-look="c"] .stage { grid-template-columns: minmax(0, 1fr); padding: clamp(20px, 5vw, 64px); align-content: center; gap: 0; position: relative; }
html[data-look="c"] .pics { position: absolute; bottom: clamp(56px, 8vh, 96px); right: clamp(16px, 4vw, 56px); display: flex; gap: 14px; align-items: flex-start; }
html[data-look="c"] .couple { width: clamp(110px, 15vw, 210px); aspect-ratio: 4 / 5; object-fit: cover; border: 6px solid #fff; transform: rotate(-4deg); }
html[data-look="c"] .mood { width: clamp(96px, 12vw, 170px); transform: rotate(5deg); margin-top: 26px; }
html[data-look="c"] .mood img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 6px solid #fff; }
html[data-look="c"] .mood figcaption { text-align: center; font-weight: 600; }
html[data-look="c"] h1 { font-stretch: 62%; font-weight: 900; font-size: clamp(64px, 14.5vw, 230px); line-height: .86; letter-spacing: -.01em; max-width: 9em; text-wrap: balance; }
html[data-look="c"] .sub { margin-top: 26px; font-size: clamp(19px, 1.7vw, 24px); font-weight: 600; max-width: 30em; }
html[data-look="c"] .note { margin-top: 4px; }
html[data-look="c"] .line { margin-top: 22px; font-size: clamp(22px, 2.4vw, 34px); line-height: 1.15; font-weight: 800; font-stretch: 80%; max-width: 24em; min-height: 2.4em; }
html[data-look="c"] .answers { margin-top: 10px; gap: 22px; }
html[data-look="c"] .btn { border-radius: 0; font-size: 26px; font-stretch: 80%; font-weight: 900; padding: .6em 1.6em; }
html[data-look="c"] .btn-yes, html[data-look="c"] .btn-no.gave-up { background: #1B1408; color: #F5B301; }
html[data-look="c"] .btn-no { background: #fff; color: #1B1408; }
html[data-look="c"] .plan-list { margin-top: 30px; font-size: clamp(19px, 1.8vw, 24px); }
html[data-look="c"] .foot { margin-top: 24px; }

@media (max-width: 760px) {
  html[data-look="b"] .stage { grid-template-columns: minmax(0, 1fr); align-content: start; }
  html[data-look="b"] .pics { max-width: 300px; }
  html[data-look="b"] .mood { right: -10px; }
  html[data-look="c"] .pics { position: static; margin-bottom: 20px; }
  .msg { max-width: 88%; }
}

/* ---------- mock controls: removed before the real links go out ---------- */
.mock { position: fixed; left: 10px; bottom: 10px; z-index: 99; font: 13px/1.3 system-ui, sans-serif; background: #111; color: #fff; padding: 8px 10px; border-radius: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: calc(100vw - 20px); }
.mock a { color: #fff; text-decoration: underline; padding: 4px 2px; }
.mock a[aria-current] { text-decoration: none; font-weight: 700; color: #FFD84A; }
@media (max-width: 760px) { .mock { position: static; border-radius: 0; max-width: none; } }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font:18px system-ui">This needs JavaScript. Or just text me yes.</p></noscript>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const who = q.get('for') === 'nazneen' ? 'nazneen' : 'zara';
  const look = ['a', 'b', 'c'].includes(q.get('look')) ? q.get('look') : 'a';
  const MOCK = true; // set to false for the real links
  document.documentElement.dataset.look = look;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ------------------------------------------------------------------ content */
  const DATA = {
    zara: {
      name: 'Zara', from: 'Arjun', fromKey: 'arjun', friend: 'Nirvan', other: 'Nazneen',
      lines: [
        '?',
        'Zara.',
        "It's a Saturday. What else are you doing?",
        'Nirvan and I planned a whole thing.',
        "There's something tomorrow I'm going to beat you at. You should be there for it.",
        'Saying no counts as forfeiting, by the way.',
        "That's another loss for you. I'm keeping count.",
        "Okay, I'll go easy on you. Slightly.",
        "Fine. I'll stop asking.",
        'I lied.'
      ],
      hint: 'I am going to beat you at it, though.'
    },
    nazneen: {
      name: 'Nazneen', from: 'Nirvan', fromKey: 'nirvan', friend: 'Arjun', other: 'Zara',
      lines: [
        '?',
        'Nazneen.',
        "It's a Saturday. What else are you doing?",
        'Arjun and I planned a whole thing.',
        "Zara's getting asked too. Don't leave her alone with us.",
        'You can pick the music in the car.',
        'The whole way. Both ways.',
        "I'm not above begging.",
        "Fine. I'll stop asking.",
        'I lied.'
      ],
      hint: ''
    }
  };
  const d = DATA[who];
  const AFTER = "There's only yes now. Take your time.";
  const WEAR = "Casual and nice, something you can move in. Not a dress you can't run in.";

  /* ------------------------------------------------------------------ photos
     Real files go in photos/ and are named here. Anything missing falls back to a drawn placeholder. */
  const PHOTOS = {
    arjun:  { couple: '', moods: ['', '', '', ''], happy: '' },
    nirvan: { couple: '', moods: ['', '', '', ''], happy: '' }
  };
  const HUE = { arjun: '#7FA7D9', nirvan: '#D99A7F' };
  function drawn(label, mouth, bg, two) {
    const mouths = {
      smile: 'M160 250 Q200 285 240 250', flat: 'M162 262 L238 262',
      frown: 'M160 272 Q200 244 240 272', sob: 'M156 284 Q200 232 244 284',
      grin: 'M150 240 Q200 310 250 240 Z'
    };
    const head = (cx) => `<circle cx="${cx}" cy="215" r="${two ? 78 : 105}" fill="#fff" opacity=".92"/>
      <circle cx="${cx - 30}" cy="195" r="9" fill="#222"/><circle cx="${cx + 30}" cy="195" r="9" fill="#222"/>
      <path d="${mouths[mouth].replace(/(\d+) (\d+)/g, (m, x, y) => (+x + cx - 200) + ' ' + y)}" stroke="#222" stroke-width="8" fill="${mouth === 'grin' ? '#222' : 'none'}" stroke-linecap="round"/>
      ${mouth === 'sob' ? `<path d="M${cx - 30} 212 q-10 26 0 34 q10 -8 0 -34" fill="#5db0ff"/><path d="M${cx + 30} 212 q-10 26 0 34 q10 -8 0 -34" fill="#5db0ff"/>` : ''}`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${bg}"/>
      ${two ? head(130) + head(275) : head(200)}
      <text x="200" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#111">${label}</text></svg>`;
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }
  const MOUTHS = ['smile', 'flat', 'frown', 'sob'];
  function photo(kind, stage) {
    const p = PHOTOS[d.fromKey], bg = HUE[d.fromKey];
    if (kind === 'couple') return p.couple || drawn(`Photo of ${d.from} and ${d.name} goes here`, 'smile', bg, true);
    if (kind === 'happy') return p.happy || drawn(`${d.from}, happy (placeholder)`, 'grin', bg);
    return p.moods[stage] || p.moods[0] || drawn(`${d.from}, sad level ${stage} (placeholder)`, MOUTHS[stage], bg);
  }
  // when there is one real photo but no sad versions, fade it with CSS instead
  const sadAttr = (stage) => (PHOTOS[d.fromKey].moods[0] && !PHOTOS[d.fromKey].moods[stage]) ? stage : 0;

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const app = document.getElementById('app');
  const yesBtn = el('button', 'btn btn-yes', 'Yes');
  const noBtn = el('button', 'btn btn-no', 'No');
  yesBtn.type = noBtn.type = 'button';
  noBtn.tabIndex = -1; // the keyboard is not a way round it

  /* ------------------------------------------------------------------ the two renderers */
  let ui;
  if (look === 'a') ui = chatUI(); else ui = stageUI();

  function planList() {
    const dl = el('dl', 'plan-list');
    [['When', 'Saturday, 3:00 PM'], ['Pickup', `${d.from} comes to you`], ['Wear', WEAR], ['Plan', 'Not telling you']]
      .forEach(([k, v]) => { dl.append(el('dt', '', k), el('dd', '', v)); });
    return dl;
  }

  function chatUI() {
    const text = (s) => s.toLowerCase().replace(/\.$/, '');
    const wrap = el('div', 'chat');
    const head = el('header', 'chat-head');
    const av = el('img'); av.src = photo('mood', 0); av.alt = '';
    const meta = el('div'); const status = el('div', 'status', '');
    meta.append(el('div', 'who', d.from), status);
    head.append(av, meta);
    const msgs = el('div', 'msgs'); msgs.setAttribute('aria-live', 'polite');
    const reply = el('div', 'reply'); reply.hidden = true;
    reply.append(noBtn, yesBtn);
    wrap.append(head, msgs, reply); app.append(wrap);

    let queue = Promise.resolve();
    const wait = (ms) => new Promise(r => setTimeout(r, calm ? 0 : ms));
    const toEnd = () => { document.scrollingElement.scrollTop = document.scrollingElement.scrollHeight; };
    function bubble(item, mine) {
      let b;
      if (typeof item === 'string') b = el('div', 'msg' + (mine ? ' me' : ''), mine ? item : text(item));
      else if (item.plan) { b = el('div', 'msg plan'); b.append(planList()); }
      else {
        b = el('div', 'msg photo' + (item.photo === 'couple' ? ' wide' : ''));
        const im = el('img'); im.src = photo(item.photo, item.stage || 0); im.dataset.sad = item.photo === 'mood' ? sadAttr(item.stage) : 0;
        im.alt = item.photo === 'couple' ? `${d.from} and ${d.name}` : `${d.from}'s face`;
        b.append(im);
      }
      msgs.append(b); toEnd();
    }
    function send(item, mine) {
      queue = queue.then(async () => {
        if (!mine && !calm) {
          status.textContent = 'typing…';
          await wait(typeof item === 'string' ? Math.min(1100, 420 + item.length * 14) : 800);
          status.textContent = '';
        }
        bubble(item, mine);
        await wait(220);
      });
      return queue;
    }
    [d.name, 'Are you free tomorrow?', `Double date. You and me, ${d.friend} and ${d.other}.`, { photo: 'couple' }, "3 PM. I'm picking you up.", "Not telling you what we're doing."]
      .forEach(m => send(m));
    queue.then(() => { reply.hidden = false; toEnd(); ready(); });

    return {
      onNo(count, stageChanged, stage) {
        send(d.lines[count - 1]);
        if (stageChanged) { send({ photo: 'mood', stage }); queue.then(() => { av.src = photo('mood', stage); av.dataset.sad = sadAttr(stage); }); }
      },
      onGaveUp() { send(AFTER); },
      onYes() {
        reply.hidden = true;
        send('Yes', true);
        send('Knew it.');
        send({ photo: 'happy' }); queue.then(() => { av.src = photo('happy'); av.dataset.sad = 0; });
        send("Tomorrow, 3 PM. Be ready, I'm picking you up.");
        send("Wear something casual and nice that you can move in. Not a dress you can't run in.");
        send("Still not telling you what we're doing.");
        if (d.hint) send(d.hint);
        send({ plan: true });
        send(`${d.other} got her own one of these from ${d.friend}.`);
      },
      yesScale: (count) => 1 + Math.min(count, 10) * 0.045
    };
  }

  function stageUI() {
    const stage = el('main', 'stage');
    const pics = el('div', 'pics');
    const couple = el('img', 'couple'); couple.src = photo('couple'); couple.alt = `${d.from} and ${d.name}`;
    const mood = el('figure', 'mood'); const moodImg = el('img'); moodImg.src = photo('mood', 0); moodImg.alt = `${d.from}'s face`;
    const cap = el('figcaption', '', `${d.from}, right now`);
    mood.append(moodImg, cap); pics.append(couple, mood);
    const copy = el('div', 'copy');
    const h1 = el('h1', '', `${d.name}, are you free tomorrow?`);
    const sub = el('p', 'sub', `Double date. You and me, ${d.friend} and ${d.other}. I'm picking you up at 3 PM.`);
    const note = el('p', 'note', "Not telling you what we're doing.");
    const line = el('p', 'line'); line.setAttribute('aria-live', 'polite');
    const answers = el('div', 'answers'); answers.append(yesBtn, noBtn);
    copy.append(h1, sub, note, line, answers);
    stage.append(pics, copy); app.append(stage);
    setTimeout(ready, 0);
    return {
      onNo(count, stageChanged, st) { line.textContent = d.lines[count - 1]; if (stageChanged) { moodImg.src = photo('mood', st); moodImg.dataset.sad = sadAttr(st); } },
      onGaveUp() { line.textContent = AFTER; },
      onYes() {
        moodImg.src = photo('happy'); moodImg.dataset.sad = 0; cap.textContent = `${d.from}, now`;
        h1.textContent = 'Knew it.';
        sub.textContent = "Tomorrow. Be ready, I'm picking you up.";
        note.remove(); line.remove(); answers.remove();
        copy.append(planList());
        if (d.hint) copy.append(el('p', 'foot', d.hint));
        copy.append(el('p', 'foot', `${d.other} got her own one of these from ${d.friend}.`));
      },
      yesScale: (count) => 1 + Math.min(count, 10) * (look === 'c' ? 0.14 : 0.07)
    };
  }

  /* ------------------------------------------------------------------ the No button that cannot be pressed */
  let count = 0, lastLineAt = 0, movingUntil = 0, floated = false, gaveUp = false, answered = false, live = false;
  function ready() { live = true; }

  function floatNo() {
    if (floated) return;
    const r = noBtn.getBoundingClientRect();
    const spacer = el('span', 'no-spacer'); spacer.style.width = r.width + 'px'; spacer.style.height = r.height + 'px';
    noBtn.after(spacer);
    document.body.append(noBtn);
    noBtn.classList.add('floating');
    noBtn.style.left = r.left + 'px'; noBtn.style.top = r.top + 'px';
    noBtn.getBoundingClientRect(); // settle the start position before the first move
    floated = true;
  }

  function evade(px, py) {
    floatNo();
    const pad = 14, W = innerWidth, H = innerHeight, bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
    const yr = yesBtn.getBoundingClientRect(), cur = noBtn.getBoundingClientRect();
    const mock = document.querySelector('.mock'); const mr = mock ? mock.getBoundingClientRect() : null;
    const hits = (x, y, r, gap) => r && !(x > r.right + gap || x + bw < r.left - gap || y > r.bottom + gap || y + bh < r.top - gap);
    let pick = null;
    for (let i = 0; i < 60; i++) {
      const x = pad + Math.random() * Math.max(1, W - bw - 2 * pad), y = pad + Math.random() * Math.max(1, H - bh - 2 * pad);
      if (hits(x, y, yr, 28) || hits(x, y, mr, 8)) continue;
      const farFromPointer = px == null || Math.hypot(x + bw / 2 - px, y + bh / 2 - py) > Math.min(W, H) * 0.32;
      const farFromSelf = Math.hypot(x - cur.left, y - cur.top) > 140;
      if (farFromPointer && farFromSelf) { pick = [x, y]; break; }
      pick = pick || [x, y];
    }
    if (!pick) pick = [pad, pad];
    noBtn.style.left = pick[0] + 'px'; noBtn.style.top = pick[1] + 'px';
    movingUntil = performance.now() + 230;
  }

  function attempt(px, py) {
    if (!live || answered || gaveUp) return;
    evade(px, py);
    const now = performance.now();
    if (now - lastLineAt < 650) return; // the button always runs, but he does not talk faster than this
    lastLineAt = now; count++;
    const stage = Math.min(3, Math.floor(count / 3));
    const stageChanged = count % 3 === 0 && count <= 9;
    yesBtn.style.transform = `scale(${ui.yesScale(count)})`;
    ui.onNo(count, stageChanged, stage);
    if (count >= d.lines.length) {
      gaveUp = true;
      noBtn.textContent = 'Yes'; noBtn.classList.add('gave-up'); noBtn.tabIndex = 0;
      // it stops running and goes back to where it started, next to the other Yes
      const spacer = document.querySelector('.no-spacer');
      if (spacer) { noBtn.classList.remove('floating'); noBtn.style.left = noBtn.style.top = ''; spacer.replaceWith(noBtn); floated = false; }
      yesBtn.style.transform = '';
      ui.onGaveUp();
    }
  }

  // mouse: run before the cursor arrives
  addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || !live || answered || gaveUp || performance.now() < movingUntil) return;
    const r = noBtn.getBoundingClientRect();
    const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right), dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(dx, dy) < 70) attempt(e.clientX, e.clientY);
  });
  // touch and anything that gets through: cancel the press and run
  noBtn.addEventListener('pointerdown', (e) => { if (gaveUp) return; e.preventDefault(); attempt(e.clientX, e.clientY); });
  noBtn.addEventListener('touchstart', (e) => { if (!gaveUp) e.preventDefault(); }, { passive: false });
  noBtn.addEventListener('click', (e) => { if (gaveUp) { sayYes(); return; } e.preventDefault(); attempt(e.clientX || null, e.clientY || null); });
  noBtn.addEventListener('focus', () => { if (!gaveUp) { noBtn.blur(); attempt(null, null); } });
  noBtn.addEventListener('keydown', (e) => { if (!gaveUp) e.preventDefault(); });
  addEventListener('resize', () => { if (floated && !answered) evade(null, null); });

  function sayYes() {
    if (answered || !live) return;
    answered = true;
    noBtn.remove(); document.querySelector('.no-spacer')?.remove();
    yesBtn.style.transform = '';
    ui.onYes();
  }
  yesBtn.addEventListener('click', sayYes);

  /* ------------------------------------------------------------------ mock controls */
  if (MOCK) {
    const bar = el('nav', 'mock'); bar.setAttribute('aria-label', 'Mock controls');
    bar.append(el('span', '', 'Mock only:'));
    const link = (label, f, l) => { const a = el('a', '', label); a.href = `?for=${f}&look=${l}`; if (f === who && l === look) a.setAttribute('aria-current', 'true'); return a; };
    [['A text thread', 'a'], ['B green', 'b'], ['C marigold', 'c']].forEach(([t, l]) => bar.append(link(t, who, l)));
    bar.append(el('span', '', '|'));
    bar.append(link("Zara's link", 'zara', look), link("Nazneen's link", 'nazneen', look));
    document.body.prepend(bar);
  }
})();
</script>
